[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mover_sim"
version = "0.1.0"
description = "A general-purpose simulator for moving platforms in a global coordinate frame."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "h5py>=3.0.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
